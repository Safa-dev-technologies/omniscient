# Production Docker Compose for Omniscient
# Note: 'version' key removed - deprecated in Docker Compose V2+

services:
  postgres:
    image: postgres:15-alpine
    container_name: omniscient-postgres
    environment:
      POSTGRES_USER: omniscient
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniscient}
      POSTGRES_DB: omniscient
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omniscient']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - omniscient-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omniscient-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - omniscient-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: omniscient-app
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://omniscient:${POSTGRES_PASSWORD:-omniscient}@postgres:5432/omniscient
      REDIS_URL: redis://redis:6379
      # Required - set these via env vars or .env file
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX:-omniscient}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      # Admin & Security
      MASTER_API_KEY: ${MASTER_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
      # AWS Secrets Manager (optional)
      AWS_SECRETS_ARN: ${AWS_SECRETS_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - omniscient-network
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    container_name: omniscient-workers
    command: ['node', 'dist/workers.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://omniscient:${POSTGRES_PASSWORD:-omniscient}@postgres:5432/omniscient
      REDIS_URL: redis://redis:6379
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX:-omniscient}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
      # AWS Secrets Manager (optional)
      AWS_SECRETS_ARN: ${AWS_SECRETS_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - omniscient-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  omniscient-network:
    driver: bridge
