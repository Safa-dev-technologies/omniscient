<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omniscient Test UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar for chat messages */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-bold text-gray-900">Omniscient Test UI</h1>
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
              <label for="apiKey" class="text-sm font-medium text-gray-700">API Key:</label>
              <input
                type="password"
                id="apiKey"
                placeholder="omni_live_..."
                class="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64"
              />
              <span id="apiKeyStatus" class="hidden text-green-600">✓</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Tabs -->
    <div class="bg-white border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <nav class="flex space-x-8">
          <button
            id="chatTab"
            class="tab-button py-4 px-1 border-b-2 font-medium text-sm active border-blue-500 text-blue-600"
            onclick="switchTab('chat')"
          >
            Chat
          </button>
          <button
            id="knowledgeTab"
            class="tab-button py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300"
            onclick="switchTab('knowledge')"
          >
            Knowledge
          </button>
        </nav>
      </div>
    </div>

    <!-- Error Toast -->
    <div id="errorToast" class="hidden fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded shadow-lg z-50 max-w-md">
      <div class="flex items-center justify-between">
        <span id="errorMessage"></span>
        <button onclick="hideError()" class="text-red-700 hover:text-red-900 ml-4">&times;</button>
      </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
      <!-- Chat Tab -->
      <div id="chatPane" class="tab-pane">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col" style="height: calc(100vh - 280px);">
          <!-- Chat Messages -->
          <div id="chatMessages" class="chat-messages flex-1 overflow-y-auto p-4 space-y-4">
            <div class="text-center text-gray-500 py-8">
              Start a conversation by sending a message below
            </div>
          </div>

          <!-- Typing Indicator -->
          <div id="typingIndicator" class="hidden px-4 py-2">
            <div class="flex items-center space-x-2 text-gray-500">
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
              <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
              <span class="ml-2 text-sm">Bot is typing...</span>
            </div>
          </div>

          <!-- Input Area -->
          <div class="border-t border-gray-200 p-4">
            <div class="flex items-center gap-2 mb-2">
              <button
                onclick="newConversation()"
                class="px-3 py-1 text-sm text-gray-600 hover:text-gray-900 border border-gray-300 rounded-md hover:bg-gray-50"
              >
                New Conversation
              </button>
            </div>
            <div class="flex gap-2">
              <input
                type="text"
                id="chatInput"
                placeholder="Type your message..."
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                onkeypress="if(event.key === 'Enter') sendMessage()"
              />
              <button
                onclick="sendMessage()"
                id="sendButton"
                class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
              >
                Send
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Knowledge Tab -->
      <div id="knowledgePane" class="tab-pane hidden">
        <div class="space-y-6">
          <!-- Upload Area -->
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Upload Knowledge Document</h2>
            <div
              id="uploadArea"
              class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition-colors cursor-pointer"
              ondrop="handleDrop(event)"
              ondragover="handleDragOver(event)"
              ondragleave="handleDragLeave(event)"
            >
              <input
                type="file"
                id="fileInput"
                accept=".pdf,.txt,.docx"
                class="hidden"
                onchange="handleFileSelect(event)"
              />
              <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <p class="mt-2 text-sm text-gray-600">
                <button onclick="document.getElementById('fileInput').click()" class="text-blue-600 hover:text-blue-800 font-medium">Click to upload</button>
                or drag and drop
              </p>
              <p class="text-xs text-gray-500 mt-1">PDF, TXT, or DOCX (MAX. 50MB)</p>
            </div>
            <div id="uploadProgress" class="hidden mt-4">
              <div class="bg-gray-200 rounded-full h-2">
                <div id="uploadProgressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
              </div>
              <p id="uploadStatus" class="text-sm text-gray-600 mt-2"></p>
            </div>
          </div>

          <!-- Knowledge Sources List -->
          <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
              <h2 class="text-lg font-semibold text-gray-900">Knowledge Sources</h2>
              <button
                onclick="loadKnowledgeSources()"
                class="px-4 py-2 text-sm bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200"
              >
                Refresh
              </button>
            </div>
            <div id="knowledgeSourcesList" class="p-6">
              <div class="text-center text-gray-500 py-8">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/v1';
    let currentConversationId = null;
    let sessionId = localStorage.getItem('sessionId') || `session_${Date.now()}`;
    let knowledgePollInterval = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Load saved API key
      const savedApiKey = localStorage.getItem('apiKey');
      if (savedApiKey) {
        document.getElementById('apiKey').value = savedApiKey;
        validateApiKey();
      }

      // Save API key on change
      document.getElementById('apiKey').addEventListener('change', (e) => {
        localStorage.setItem('apiKey', e.target.value);
        validateApiKey();
      });

      // Save session ID
      localStorage.setItem('sessionId', sessionId);

      // Load knowledge sources if on knowledge tab
      if (window.location.hash === '#knowledge') {
        switchTab('knowledge');
      } else {
        switchTab('chat');
      }
    });

    // Tab switching
    function switchTab(tab) {
      const chatPane = document.getElementById('chatPane');
      const knowledgePane = document.getElementById('knowledgePane');
      const chatTab = document.getElementById('chatTab');
      const knowledgeTab = document.getElementById('knowledgeTab');

      if (tab === 'chat') {
        chatPane.classList.remove('hidden');
        knowledgePane.classList.add('hidden');
        chatTab.classList.add('active', 'border-blue-500', 'text-blue-600');
        chatTab.classList.remove('border-transparent', 'text-gray-500');
        knowledgeTab.classList.remove('active', 'border-blue-500', 'text-blue-600');
        knowledgeTab.classList.add('border-transparent', 'text-gray-500');
        if (knowledgePollInterval) {
          clearInterval(knowledgePollInterval);
          knowledgePollInterval = null;
        }
      } else {
        chatPane.classList.add('hidden');
        knowledgePane.classList.remove('hidden');
        knowledgeTab.classList.add('active', 'border-blue-500', 'text-blue-600');
        knowledgeTab.classList.remove('border-transparent', 'text-gray-500');
        chatTab.classList.remove('active', 'border-blue-500', 'text-blue-600');
        chatTab.classList.add('border-transparent', 'text-gray-500');
        loadKnowledgeSources();
        startKnowledgePolling();
      }
    }

    // API Key validation
    async function validateApiKey() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        document.getElementById('apiKeyStatus').classList.add('hidden');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/knowledge/sources?limit=1`, {
          headers: {
            'Authorization': `Bearer ${apiKey}`
          }
        });

        if (response.ok) {
          document.getElementById('apiKeyStatus').classList.remove('hidden');
        } else {
          document.getElementById('apiKeyStatus').classList.add('hidden');
        }
      } catch (error) {
        document.getElementById('apiKeyStatus').classList.add('hidden');
      }
    }

    // Error handling
    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorToast').classList.remove('hidden');
      setTimeout(() => hideError(), 5000);
    }

    function hideError() {
      document.getElementById('errorToast').classList.add('hidden');
    }

    // Chat functions
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        showError('Please enter an API key');
        return;
      }

      // Add user message to chat
      addMessage('user', message);
      input.value = '';

      // Disable input
      const sendButton = document.getElementById('sendButton');
      sendButton.disabled = true;
      input.disabled = true;
      document.getElementById('typingIndicator').classList.remove('hidden');

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message,
            sessionId: sessionId
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error?.message || 'Failed to send message');
        }

        const data = await response.json();
        if (data.success) {
          currentConversationId = data.data.conversationId;
          
          // Add bot response
          addMessage('bot', data.data.response, {
            confidence: data.data.confidence,
            sources: data.data.sources,
            shouldEscalate: data.data.shouldEscalate
          });
        }
      } catch (error) {
        showError(error.message || 'Failed to send message');
      } finally {
        sendButton.disabled = false;
        input.disabled = false;
        document.getElementById('typingIndicator').classList.add('hidden');
        input.focus();
      }
    }

    function addMessage(role, content, metadata = {}) {
      const messagesContainer = document.getElementById('chatMessages');
      
      // Remove empty state
      const emptyState = messagesContainer.querySelector('.text-center.text-gray-500');
      if (emptyState) {
        emptyState.remove();
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

      const bubble = document.createElement('div');
      bubble.className = `max-w-xs lg:max-w-md px-4 py-2 rounded-lg ${
        role === 'user'
          ? 'bg-blue-600 text-white'
          : 'bg-gray-200 text-gray-900'
      }`;

      bubble.innerHTML = `<p class="whitespace-pre-wrap">${escapeHtml(content)}</p>`;

      // Add metadata for bot messages
      if (role === 'bot' && metadata) {
        const metaDiv = document.createElement('div');
        metaDiv.className = 'mt-2 pt-2 border-t border-gray-300 space-y-1';
        
        if (metadata.confidence !== undefined) {
          metaDiv.innerHTML += `<div class="text-xs text-gray-600">Confidence: ${(metadata.confidence * 100).toFixed(0)}%</div>`;
        }

        if (metadata.shouldEscalate) {
          metaDiv.innerHTML += '<div class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded inline-block">⚠️ Escalated</div>';
        }

        if (metadata.sources && metadata.sources.length > 0) {
          const sourcesDiv = document.createElement('div');
          sourcesDiv.className = 'text-xs text-gray-600 mt-2';
          sourcesDiv.innerHTML = '<strong>Sources:</strong><ul class="list-disc list-inside mt-1">';
          metadata.sources.forEach(source => {
            sourcesDiv.innerHTML += `<li>${escapeHtml(source.name)}${source.section ? ` - ${escapeHtml(source.section)}` : ''}</li>`;
          });
          sourcesDiv.innerHTML += '</ul>';
          metaDiv.appendChild(sourcesDiv);
        }

        bubble.appendChild(metaDiv);
      }

      messageDiv.appendChild(bubble);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function newConversation() {
      currentConversationId = null;
      document.getElementById('chatMessages').innerHTML = `
        <div class="text-center text-gray-500 py-8">
          Start a conversation by sending a message below
        </div>
      `;
    }

    // Knowledge functions
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.add('border-blue-400', 'bg-blue-50');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.remove('border-blue-400', 'bg-blue-50');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('uploadArea').classList.remove('border-blue-400', 'bg-blue-50');
      
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        uploadFile(files[0]);
      }
    }

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files.length > 0) {
        uploadFile(files[0]);
      }
    }

    async function uploadFile(file) {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        showError('Please enter an API key');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('name', file.name);

      const progressDiv = document.getElementById('uploadProgress');
      const progressBar = document.getElementById('uploadProgressBar');
      const statusText = document.getElementById('uploadStatus');

      progressDiv.classList.remove('hidden');
      progressBar.style.width = '0%';
      statusText.textContent = 'Uploading...';

      try {
        const response = await fetch(`${API_BASE}/knowledge/upload`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`
          },
          body: formData
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error?.message || 'Upload failed');
        }

        progressBar.style.width = '100%';
        statusText.textContent = 'Upload successful! Processing...';

        // Reset file input
        document.getElementById('fileInput').value = '';

        // Reload sources after a short delay
        setTimeout(() => {
          loadKnowledgeSources();
          progressDiv.classList.add('hidden');
        }, 1000);
      } catch (error) {
        progressDiv.classList.add('hidden');
        showError(error.message || 'Upload failed');
      }
    }

    async function loadKnowledgeSources() {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        document.getElementById('knowledgeSourcesList').innerHTML = `
          <div class="text-center text-gray-500 py-8">Please enter an API key</div>
        `;
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/knowledge/sources`, {
          headers: {
            'Authorization': `Bearer ${apiKey}`
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            showError('Invalid API key');
            return;
          }
          throw new Error('Failed to load knowledge sources');
        }

        const data = await response.json();
        if (data.success) {
          renderKnowledgeSources(data.data.sources || []);
        }
      } catch (error) {
        showError(error.message || 'Failed to load knowledge sources');
        document.getElementById('knowledgeSourcesList').innerHTML = `
          <div class="text-center text-red-500 py-8">Error loading sources</div>
        `;
      }
    }

    function renderKnowledgeSources(sources) {
      const container = document.getElementById('knowledgeSourcesList');
      
      if (sources.length === 0) {
        container.innerHTML = `
          <div class="text-center text-gray-500 py-8">No knowledge sources uploaded yet</div>
        `;
        return;
      }

      container.innerHTML = sources.map(source => {
        const statusColor = getStatusColor(source.status);
        return `
          <div class="border border-gray-200 rounded-lg p-4 mb-4">
            <div class="flex items-center justify-between">
              <div class="flex-1">
                <h3 class="text-lg font-medium text-gray-900">${escapeHtml(source.name)}</h3>
                <div class="mt-2 flex items-center gap-4 text-sm text-gray-600">
                  <span>Type: <strong>${escapeHtml(source.type)}</strong></span>
                  <span class="px-2 py-1 rounded text-xs font-medium ${statusColor}">
                    ${escapeHtml(source.status)}
                  </span>
                  <span>Chunks: <strong>${source.chunkCount || 0}</strong></span>
                  ${source.tokenCount ? `<span>Tokens: <strong>${source.tokenCount}</strong></span>` : ''}
                </div>
                ${source.statusMessage ? `<p class="mt-2 text-sm text-red-600">${escapeHtml(source.statusMessage)}</p>` : ''}
              </div>
              <button
                onclick="deleteSource('${source.id}')"
                class="ml-4 px-4 py-2 text-sm text-red-600 hover:text-red-800 hover:bg-red-50 rounded-md border border-red-300"
              >
                Delete
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusColor(status) {
      if (status === 'INDEXED') {
        return 'bg-green-100 text-green-800';
      } else if (['PENDING', 'EXTRACTING', 'CHUNKING', 'EMBEDDING', 'INDEXING'].includes(status)) {
        return 'bg-yellow-100 text-yellow-800';
      } else if (status === 'FAILED') {
        return 'bg-red-100 text-red-800';
      }
      return 'bg-gray-100 text-gray-800';
    }

    async function deleteSource(sourceId) {
      const apiKey = document.getElementById('apiKey').value;
      if (!apiKey) {
        showError('Please enter an API key');
        return;
      }

      if (!confirm('Are you sure you want to delete this source?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/knowledge/sources/${sourceId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${apiKey}`
          }
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error?.message || 'Delete failed');
        }

        loadKnowledgeSources();
      } catch (error) {
        showError(error.message || 'Delete failed');
      }
    }

    function startKnowledgePolling() {
      if (knowledgePollInterval) {
        clearInterval(knowledgePollInterval);
      }
      
      knowledgePollInterval = setInterval(() => {
        const container = document.getElementById('knowledgeSourcesList');
        const hasPending = container.textContent.includes('PENDING') || 
                          container.textContent.includes('EXTRACTING') ||
                          container.textContent.includes('CHUNKING') ||
                          container.textContent.includes('EMBEDDING') ||
                          container.textContent.includes('INDEXING');
        
        if (hasPending) {
          loadKnowledgeSources();
        }
      }, 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
